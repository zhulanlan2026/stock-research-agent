[tool.uv.workspace]
members = [
    "apps/backend",
    "apps/xtquant-collector",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["stock_research", "xtquant_collector"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"apps/backend/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = [
    "^venv/",
    "^\\.venv/",
    "^volumes/",
    "^node_modules/",
    "^apps/web/",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["apps/backend/tests", "apps/xtquant-collector/tests", "tests"]
asyncio_mode = "auto"
