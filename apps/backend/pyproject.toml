[project]
name = "stock-research-backend"
version = "0.1.0"
description = "FastAPI backend for the individual stock research platform."
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4,<25",
    "orjson>=3.10,<4",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "alembic>=1.19,<2",
    "argon2-cffi>=23.1,<25",
    "PyJWT>=2.9,<3",
    "cryptography>=48,<51",
    "asyncpg>=0.30,<1",
    "redis>=5.2,<6",
    "minio>=7.2,<8",
    "python-multipart>=0.0.9",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "lxml>=5,<7",
]

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "pytest>=9,<10",
    "pytest-asyncio>=0.27",
    "ruff>=0.8,<1",
    "mypy>=1.14,<2",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
