[project]
name = "stock-research-akshare-collector"
version = "0.1.0"
description = "AKShare / Tushare market data collector."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4,<25",
    "httpx>=0.28,<1",
    "akshare>=1.16,<2",
    "tushare>=1.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=0.27",
    "ruff>=0.8,<1",
    "mypy>=1.14,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akshare_collector"]
