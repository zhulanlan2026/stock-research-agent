[project]
name = "stock-research-xtquant-collector"
version = "0.1.0"
description = "Windows MiniQMT/XTQuant collector."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4,<25",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.8,<1",
    "mypy>=1.14,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xtquant_collector"]
