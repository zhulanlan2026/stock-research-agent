groups:
  - name: stock-research
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend is down"
      - alert: HighInboxPending
        expr: inbox_pending > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Inbox pending events are high"
      - alert: HighLstmLatency
        expr: technical_lstm_latency_ms_last > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LSTM cycle prediction latency is high"
