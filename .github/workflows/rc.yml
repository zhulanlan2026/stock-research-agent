name: RC

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  retrieval-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync
      - run: uv run pytest apps/backend/tests/unit/test_golden.py -q

  risk-replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research123
          POSTGRES_DB: research_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d research_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://research:research123@localhost:5432/research_db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync
      - run: uv run pytest apps/backend/tests/unit/test_replay_service.py -q

  security-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync
      - run: uv run pytest apps/backend/tests/security -q

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync
      - run: uv run pytest tests/performance -q

  backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research123
          POSTGRES_DB: research_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d research_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://research:research123@localhost:5432/research_db
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research123
      POSTGRES_DB: research_db
      PGHOST: localhost
      PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: uv sync
      - name: Migrate schema
        run: |
          cd apps/backend
          uv run alembic -c alembic.ini upgrade head
          cd ../..
      - name: Run backup/restore drill
        run: bash scripts/backup_restore_drill.sh

  pitr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run point-in-time recovery drill
        run: bash scripts/pitr_drill.sh

  full-integration:
    runs-on: ubuntu-latest
    env:
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:latest server /data --console-address ":9001"
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9000/minio/health/live; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live
      - run: uv run pytest tests/integration -q

  neo4j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync
      - name: Start Neo4j
        run: |
          docker run -d --name neo4j -p 7474:7474 -p 7687:7687 \
            -e NEO4J_AUTH=neo4j/password123 \
            neo4j:5-community
      - name: Wait for Neo4j
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:7474; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:7474
      - run: uv run pytest tests/integration/test_neo4j_publish.py -q

  milvus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync
      - name: Start Milvus dependencies
        run: |
          docker network create milvus-net
          docker run -d --name etcd --network milvus-net \
            quay.io/coreos/etcd:v3.5.5 \
            etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
          docker run -d --name minio-milvus --network milvus-net \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ":9002"
      - name: Start Milvus
        run: |
          docker run -d --name milvus --network milvus-net -p 19530:19530 -p 9091:9091 \
            -e ETCD_ENDPOINTS=etcd:2379 \
            -e MINIO_ADDRESS=minio-milvus:9000 \
            milvusdb/milvus:v2.5.27 milvus run standalone
      - name: Wait for Milvus
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:9091/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:9091/healthz
      - run: uv run pytest tests/integration/test_milvus_dense.py -q
