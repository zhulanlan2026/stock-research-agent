name: RC

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  retrieval-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync
      - run: uv run pytest apps/backend/tests/unit/test_golden.py -q

  risk-replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research123
          POSTGRES_DB: research_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://research:research123@localhost:5432/research_db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync
      - run: uv run pytest apps/backend/tests/unit/test_replay_service.py -q

  security-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync
      - run: uv run pytest apps/backend/tests/security -q

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync
      - run: uv run pytest tests/performance -q
