name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest apps/backend/tests apps/xtquant-collector/tests
      - run: uv run bandit -r apps/backend/src --severity-level medium
      - run: uv run pip-audit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @stock-research/web lint
      - run: pnpm --filter @stock-research/web format:check
      - run: pnpm --filter @stock-research/web typecheck
      - run: pnpm --filter @stock-research/web test
      - run: pnpm audit
